[package]
name = "mimic"
version = "0.1.0"
edition = "2021"
description = "Set a custom discord rich presence for any game"
license = "MIT"
publish = false

[lib]
name = "mimic_lib"

[build-dependencies]
tauri-build = "2"

[dependencies]
mimic-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls = schannel on windows, so no extra toolchain is needed to build
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

# only the non-windows type-check stub needs this
[target.'cfg(not(windows))'.dependencies]
tokio = { version = "1", features = ["io-util"] }
