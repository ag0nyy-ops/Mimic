[package]
name = "mimic-core"
version = "0.2.0"
edition = "2021"
description = "Discord rich presence over local ipc: frame codec, payload builder, debounce and connection manager. No platform code except the ipc transports (windows named pipes, unix sockets on macos and linux)."
license-file = "../../LICENSE"
publish = false

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros", "test-util"] }
tempfile = "3"
