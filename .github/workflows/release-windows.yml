name: release-windows

# Only runs when a version tag like v0.1.0 is pushed. Builds the installers and
# attaches them to a DRAFT release, so nothing goes public until it is
# published by hand from the releases page.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${app_version}" ]; then
            echo "tag ${GITHUB_REF_NAME} doesn't match the app version v${app_version} in tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Install frontend dependencies
        run: npm ci

      - name: Test everything
        run: cargo test --workspace

      - name: Build installers (nsis + msi)
        run: npm run tauri -- build

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "mimic ${GITHUB_REF_NAME}" \
            --notes "Windows installers for mimic ${GITHUB_REF_NAME}. Windows only for now: macOS and Linux versions are still to come. The installers are not code signed, so windows SmartScreen will warn when you run them. Use at your own risk, see the disclaimer in the readme." \
            target/release/bundle/nsis/*.exe \
            target/release/bundle/msi/*.msi
