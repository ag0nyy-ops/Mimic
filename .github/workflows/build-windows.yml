name: build-windows

# Runs the tests and builds the installers on every push and pull request.
# The installers are uploaded as workflow artifacts so they can be downloaded
# and tried out. This workflow never creates a release.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick check of the platform independent core (frames, payloads, debounce,
  # connection manager). No webview libraries needed, so it's fast.
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo test

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Install frontend dependencies
        run: npm ci

      - name: Test everything (core + app glue)
        run: cargo test --workspace

      - name: Build installers (nsis + msi)
        run: npm run tauri -- build

      - name: List what was built
        shell: bash
        run: ls -lh target/release/bundle/nsis target/release/bundle/msi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: mimic-windows-installers
          path: |
            windows/target/release/bundle/nsis/*.exe
            windows/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
